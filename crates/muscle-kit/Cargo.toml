[package]
name = "zeroclaw-muscle-kit"
version = "0.1.0"
edition = "2021"
authors = ["theonlyhennygod"]
license = "MIT OR Apache-2.0"
description = "High-frequency trading signal engine with Polars.rs DataFrame processing"
repository = "https://github.com/zeroclaw-labs/zeroclaw"
readme = "README.md"
keywords = ["trading", "signal", "polars", "binance", "hft"]
categories = ["finance", "data-processing"]

[dependencies]
# Async runtime
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "signal"] }
tokio-util = { version = "0.7", default-features = false }
tokio-stream = { version = "0.1.18", default-features = false, features = ["sync"] }

# Stream merging
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# WebSocket client
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }

# Data Engine - Polars for high-performance DataFrame operations
polars = { version = "0.46", features = ["lazy", "dtype-full", "temporal", "rolling_window", "performant"] }
polars-lazy = "0.46"
polars-core = "0.53"
polars-ops = "0.46"

# State Store - Redis async client
redis = { version = "0.29", features = ["aio", "tokio-comp", "connection-manager"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["std"] }

# JSON Schema generation for config export
schemars = "1.2"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Async traits
async-trait = "0.1"

# Logging
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Config
toml = "0.8"

# Time
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

[dev-dependencies]
tokio = { version = "1.50", features = ["test-util"] }
