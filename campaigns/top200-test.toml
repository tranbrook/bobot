# Use 5m interval for better signal frequency
default_interval = "5m"

# Symbol-specific intervals (override default)
# Major coins get 1m for faster signals
[symbol_intervals]
BTCUSDT = "1m"
ETHUSDT = "1m"
BNBUSDT = "1m"
SOLUSDT = "1m"
XRPUSDT = "1m"

[strategies]
# Enable both strategies for maximum signal generation
trend_following = true
trend_following_weight = 0.5
mean_reversion = true
mean_reversion_weight = 0.5

[risk]
# Very low risk for testing
max_total_position_usd = 1000.0
max_per_symbol_usd = 5.0
max_daily_trades = 1000
max_daily_trades_per_symbol = 10
emergency_pnl_threshold = -50.0
max_single_symbol_ratio = 0.1

[correlation]
enabled = false
max_correlation_threshold = 0.9
max_correlated_symbols = 50

[signal_thresholds]
# Lower thresholds for easier signal generation
min_confluence_score = 3
strong_signal_threshold = 5
